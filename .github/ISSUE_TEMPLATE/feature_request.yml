name: 功能建议
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望系统怎么做？
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 算税/申报口径
        - 台账/凭证
        - 导入（发票/流水）
        - 结账/归档/备份
        - 个税/汇算
        - 多公司/地区
        - UI/交互
        - 文档/部署
        - 其他
