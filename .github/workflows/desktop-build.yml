name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-desktop.txt
      - name: Build macOS app
        run: pyinstaller packaging/tax.spec --noconfirm --clean
      - name: Zip macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "税小智.app" "税小智-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zhixiaoshui-macos
          path: dist/税小智-macos.zip
          if-no-files-found: error
      - name: Attach macOS zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/税小智-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-desktop.txt
      - name: Build Windows app
        run: pyinstaller packaging/tax.spec --noconfirm --clean
      - name: Zip Windows app
        shell: pwsh
        run: Compress-Archive -Path "dist\税小智\*" -DestinationPath "dist\税小智-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zhixiaoshui-windows
          path: dist/税小智-windows.zip
          if-no-files-found: error
      - name: Attach Windows zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/税小智-windows.zip
